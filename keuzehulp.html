<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuzehulp & advies — Solar Outlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#22252a;
    --charcoal-soft:#2e3238;
    --orange:#ea5b1f;
    --orange-deep:#c94413;
    --green:#1f8a4c;
    --green-bg:#e8f5ec;
    --amber:#f4b400;
    --cream:#faf9f6;
    --line:#e6e3dc;
    --ink:#1a1a1a;
    --ink-soft:#5b5f66;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;margin:0;}
  .kh-wrap{
    max-width:760px;
    margin:0 auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  /* ---------- HEADER ---------- */
  .kh-header{
    background:var(--charcoal);
    color:#fff;
    padding:22px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .kh-brand{display:flex;align-items:center;gap:10px;}
  .kh-brand-mark{
    height:26px;width:auto;
    flex:none;
    display:block;
  }
  .kh-brand-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em;}
  .kh-live-badge{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;color:#c9cdd3;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    padding:5px 10px;border-radius:999px;
    white-space:nowrap;
  }
  .kh-live-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(31,138,76,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(31,138,76,.55);}
    70%{box-shadow:0 0 0 6px rgba(31,138,76,0);}
    100%{box-shadow:0 0 0 0 rgba(31,138,76,0);}
  }

  /* ---------- PROGRESS ---------- */
  .kh-progress-track{height:4px;background:var(--line);}
  .kh-progress-fill{height:4px;background:var(--orange);transition:width .35s ease;}

  .kh-body{padding:32px 28px 28px;}

  /* ---------- CATEGORY STEP ---------- */
  .kh-eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--orange-deep);margin-bottom:8px;
  }
  .kh-title{font-size:23px;font-weight:700;line-height:1.25;margin-bottom:6px;}
  .kh-sub{font-size:14.5px;color:var(--ink-soft);margin-bottom:24px;line-height:1.5;}

  .kh-cat-grid{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px;
  }
  .kh-cat-card{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    text-align:left;
    background:#fff;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
    display:flex;flex-direction:column;gap:8px;
  }
  .kh-cat-card:hover{border-color:var(--orange);transform:translateY(-1px);}
  .kh-cat-card:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .kh-cat-icon{font-size:22px;}
  .kh-cat-name{font-weight:600;font-size:14.5px;}
  .kh-cat-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}

  /* ---------- QUESTION STEP ---------- */
  .kh-q-label{font-size:18px;font-weight:600;margin-bottom:4px;}
  .kh-q-help{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  .kh-opt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .kh-opt{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    font-size:14.5px;font-weight:500;
    background:#fff;
    cursor:pointer;
    text-align:left;
    display:flex;justify-content:space-between;align-items:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .kh-opt-text{display:flex;flex-direction:column;gap:2px;}
  .kh-opt-note{font-size:12px;font-weight:400;color:var(--ink-soft);}
  .kh-opt:hover{border-color:var(--orange);}
  .kh-opt.is-selected{border-color:var(--orange);background:#fff6f1;}
  .kh-opt-check{
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .kh-opt.is-selected .kh-opt-check{border-color:var(--orange);background:var(--orange);}
  .kh-opt.is-selected .kh-opt-check::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;}

  .kh-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .kh-btn{
    font-family:inherit;font-weight:600;font-size:14px;
    border-radius:10px;padding:11px 18px;cursor:pointer;border:none;
  }
  .kh-btn-primary{background:var(--charcoal);color:#fff;}
  .kh-btn-primary:hover{background:var(--charcoal-soft);}
  .kh-btn-primary:disabled{background:#cfd2d6;cursor:not-allowed;}
  .kh-btn-ghost{background:none;color:var(--ink-soft);}
  .kh-btn-ghost:hover{color:var(--ink);}

  /* ---------- RESULT STEP ---------- */
  .kh-result-head{margin-bottom:18px;}
  .kh-sync-line{
    font-size:12px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;margin-bottom:16px;
  }
  .kh-sync-line .kh-live-dot{width:6px;height:6px;}

  .kh-product{
    border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .kh-product-thumb{
    width:56px;height:56px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,#f0ede6,#e4e0d6);
    display:flex;align-items:center;justify-content:center;font-size:22px;
    overflow:hidden;
  }
  .kh-product-thumb img{
    width:100%;height:100%;object-fit:contain;
  }
  .kh-product-main{flex:1;min-width:0;}
  .kh-product-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .kh-product-name{font-weight:600;font-size:14.5px;margin-bottom:2px;}
  .kh-product-specs{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px;}
  .kh-product-price{font-family:'Space Grotesk';font-weight:700;font-size:15px;white-space:nowrap;}
  .kh-product-cta{
    font-size:12.5px;font-weight:600;color:var(--orange-deep);
    text-decoration:none;
  }
  .kh-product-cta:hover{text-decoration:underline;}

  .kh-empty{
    border:1.5px dashed var(--line);border-radius:var(--radius);
    padding:22px;text-align:center;color:var(--ink-soft);font-size:13.5px;
  }

  .kh-advice-box{
    margin-top:18px;border-radius:var(--radius);
    background:var(--charcoal);color:#fff;
    padding:18px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;
  }
  .kh-advice-text{font-size:13.5px;line-height:1.5;color:#d7d9dc;}
  .kh-advice-text strong{color:#fff;}
  .kh-btn-orange{background:var(--orange);color:#fff;white-space:nowrap;}
  .kh-btn-orange:hover{background:var(--orange-deep);}

  @media (max-width:520px){
    .kh-cat-grid{grid-template-columns:1fr;}
    .kh-body{padding:24px 18px;}
    .kh-header{padding:18px 18px;}
    .kh-advice-box{flex-direction:column;align-items:stretch;text-align:left;}
  }

  @media (prefers-reduced-motion:reduce){
    .kh-live-dot{animation:none;}
    .kh-cat-card,.kh-opt{transition:none;}
  }
</style>
</head>

  // VRAGEN PER CATEGORIE — pas teksten aan zodra de originele teksten bekend zijn
  // ---------------------------------------------------------------------------
  const CATEGORIES = [
    { id:'zonnepanelen', icon:'☀️', name:'Zonnepanelen', desc:'Genereer eigen stroom. Breed assortiment van 375–485 Wp.' },
    { id:'batterij',     icon:'🔋', name:'Thuisbatterij', desc:'Sla zonne-energie op voor gebruik \'s avonds en \'s nachts.' },
    { id:'omvormer',     icon:'⚡',  name:'Omvormer',      desc:'Converteer zonnestroom naar wisselstroom voor je huis.' },
    { id:'laadpaal',     icon:'🔌', name:'Laadpaal',      desc:'Laad je elektrische auto slim thuis op, ook met zonne-energie.' },
  ];

  const QUESTIONS = {
    zonnepanelen: [
      { id:'esthetiek', label:'Welke uitstraling heeft je voorkeur?',
        help:'Bepaalt welk paneeltype het beste past.',
        options:[
          { label:'All Black (volledig zwart)', value:'all-black' },
          { label:'Zwart paneel / wit frame', value:'zwart-wit' },
          { label:'Glas-Glas (premium)', value:'glas-glas', note:'Beide zijden glas: duurzamer, vaak hogere prijs.' },
          { label:'Geen voorkeur', value:'geen-voorkeur', note:'We tonen dan de best passende optie, ongeacht kleur.' },
        ]},
      { id:'vermogen', label:'Heb je een voorkeur voor het vermogen per paneel?',
        help:'Hogere Wp betekent meer opbrengst per paneel — handig bij beperkt dakoppervlak.',
        options:[
          { label:'Standaard (tot 450 Wp)', value:'standaard' },
          { label:'Hoog rendement (450 Wp en hoger)', value:'hoog', note:'Minder panelen nodig voor hetzelfde totaalvermogen.' },
          { label:'Geen voorkeur', value:'geen-voorkeur' },
        ]},
    ],
    batterij: [
      { id:'fase', label:'Wat is de aansluiting van je meterkast?',
        help:'Staat meestal op de meterkast of in je energiecontract.',
        options:[
          { label:'1-fase', value:'1-fase' },
          { label:'3-fase', value:'3-fase' },
        ]},
      { id:'bouwvorm', label:'Wil je een plug-in batterij of een geïntegreerde batterij?',
        options:[
          { label:'Plug-in batterij', value:'plugin', note:'Sluit je zelf aan op een stopcontact — geen installateur nodig.' },
          { label:'Geïntegreerde batterij', value:'geintegreerd', note:'Vast aangesloten door een installateur, vaak hogere capaciteit.' },
        ]},
      { id:'verbruik', label:'Wat is je jaarverbruik (ongeveer)?',
        help:'Staat op je jaarafrekening van de energieleverancier.',
        options:[
          { label:'Minder dan 3.000 kWh', value:'klein' },
          { label:'3.000 – 5.000 kWh', value:'middel' },
          { label:'Meer dan 5.000 kWh', value:'groot' },
        ]},
      { id:'panelen', label:'Heb je al zonnepanelen, of komen die er tegelijk bij?',
        help:'Bepaalt of de batterij vooral overproductie moet opslaan, of vooral noodstroom moet bieden.',
        options:[
          { label:'Ja, panelen aanwezig of tegelijk gepland', value:'ja' },
          { label:'Nee, vooral back-up/noodstroom', value:'nee' },
        ]},
    ],
    omvormer: [
      { id:'fase', label:'Wat is de aansluiting van je meterkast?',
        options:[
          { label:'1-fase', value:'1-fase' },
          { label:'3-fase', value:'3-fase' },
        ]},
      { id:'hybride', label:'Wil je nu of later een thuisbatterij aansluiten?',
        help:'Bepaalt of een hybride omvormer nodig is.',
        options:[
          { label:'Ja, hybride gewenst', value:'ja' },
          { label:'Nee, alleen zonnepanelen', value:'nee' },
        ]},
      { id:'budget', label:'Wat is ongeveer je budget?',
        help:'Vermogen en hybride-optie kies je hierboven — budget bepaalt vooral het merk en de garantie.',
        options:[
          { label:'Tot €1.200', value:'laag', note:'Instapmerken, prima voor standaardinstallaties.' },
          { label:'€1.200 – €1.800', value:'middel', note:'Bekende A-merken met hoger rendement en langere garantie.' },
          { label:'€1.800+', value:'hoog', note:'Premium merken, hoogste efficiëntie en uitgebreide garantie.' },
        ]},
    ],
    laadpaal: [
      { id:'fase', label:'Wat is de aansluiting van je meterkast?',
        options:[
          { label:'1-fase', value:'1-fase' },
          { label:'3-fase', value:'3-fase' },
        ]},
      { id:'slim', label:'Wil je slim laden / app-koppeling?',
        options:[
          { label:'Ja, graag', value:'ja' },
          { label:'Geen voorkeur', value:'nee', note:'We tonen dan opties met en zonder app-koppeling.' },
        ]},
    ],
  };

  // ---------------------------------------------------------------------------
  // MATCHING-LOGICA — filtert eerst op actief/zichtbaar, matcht dan op antwoorden.
  // Voorraad wordt bewust niet gefilterd (niet elk product heeft betrouwbare
  // voorraadregistratie), en ook niet meer getoond in de resultaten.
  // ---------------------------------------------------------------------------
  function getMatches(category, answers, allProducts) {
    const baseLive = allProducts.filter(p => p.category === category && p.active);

    const BUDGET_RANGES = {
      omvormer: { laag:[0,1200], middel:[1200,1800], hoog:[1800,Infinity] },
    };

    // ---------------------------------------------------------------------------
    // HARDE FILTERS — dit zijn technische/categorische keuzes, geen zachte
    // voorkeuren. Als iemand "plug-in" of "1-fase" kiest, mag een geïntegreerd
    // of 3-fase product niet alsnog in de resultaten verschijnen omdat het op
    // andere punten toevallig beter scoort. Voorheen gaven deze alleen
    // scorebonus, waardoor een verkeerd type product soms toch top-3 haalde.
    // ---------------------------------------------------------------------------
    function passesHardFilters(p) {
      if ((category === 'batterij' || category === 'omvormer' || category === 'laadpaal') && answers.fase) {
        if (p.specs.fase && p.specs.fase !== answers.fase) return false;
      }
      if (category === 'batterij' && answers.bouwvorm) {
        // BUGFIX: ontbrekende bouwvorm-tag telde eerst als 'voldoet toch',
        // waardoor niet-getagde geïntegreerde batterijen tussen plug-in
        // resultaten konden verschijnen. Nu telt ontbrekend ook als mismatch.
        if (p.specs.bouwvorm !== answers.bouwvorm) return false;
      }
      if (category === 'omvormer' && answers.hybride === 'ja') {
        if (!p.specs.hybride) return false; // hybride is hier een harde eis, geen voorkeur
      }
      return true;
    }

    let live = baseLive.filter(passesHardFilters);
    // Val terug op de ongefilterde set als de harde filters niets overlaten
    // (bijv. onvolledige tags) — beter een minder perfecte match tonen dan niets.
    if (live.length === 0) live = baseLive;

    function score(p) {
      let s = 0;
      if (category === 'zonnepanelen') {
        if (answers.esthetiek && answers.esthetiek !== 'geen-voorkeur' && p.specs.esthetiek === answers.esthetiek) s += 2;
        if (answers.vermogen === 'standaard' && p.specs.vermogenWp <= 450) s += 1;
        if (answers.vermogen === 'hoog' && p.specs.vermogenWp > 450) s += 1;
      }
      if (category === 'batterij') {
        // Capaciteit: afstand tot het midden van de gekozen bucket, sterker
        // gewicht dan voorheen zodat dit de doorslag geeft binnen de
        // (al hard-gefilterde) fase/bouwvorm-match.
        const target = { klein: 3, middel: 9, groot: 15 }[answers.verbruik];
        if (target && typeof p.specs.capaciteitKwh === 'number') {
          s += Math.max(0, 4 - Math.abs(p.specs.capaciteitKwh - target) / 2);
        }
        if (answers.panelen === 'ja' && p.specs.capaciteitKwh > 10) s += 0.5;
        if (answers.panelen === 'nee' && p.specs.capaciteitKwh <= 10) s += 0.5;
      }
      if (category === 'omvormer') {
        if (answers.hybride === 'nee' && !p.specs.hybride) s += 1; // 'ja' is al hard filter, hier alleen de zachte voorkeur voor 'nee'
      }
      if (category === 'laadpaal') {
        if (answers.slim === 'ja' && p.specs.slim) s += 2;
      }
      // Budget-vraag geldt alleen voor omvormer (batterij/zonnepanelen/laadpaal hebben geen budget-vraag).
      if (answers.budget && BUDGET_RANGES[category]) {
        const [min, max] = BUDGET_RANGES[category][answers.budget] || [];
        if (min !== undefined && p.price >= min && p.price < max) s += 1;
      }
      return s;
    }

    return live
      .map(p => ({ p, s: score(p) }))
      .sort((a, b) => b.s - a.s || a.p.price - b.p.price) // bij gelijke score: goedkoopste eerst
      .slice(0, 3)
      .map(x => x.p);
  }

  const ESTHETIEK_LABELS = { 'all-black':'All Black', 'zwart-wit':'Zwart/Wit', 'glas-glas':'Glas-Glas' };

  function formatSpecs(p) {
    const sp = p.specs;
    if (p.category === 'zonnepanelen') return `${sp.vermogenWp} Wp per paneel${sp.esthetiek ? ' · ' + (ESTHETIEK_LABELS[sp.esthetiek] || sp.esthetiek) : ''}`;
    if (p.category === 'batterij')     return `${sp.capaciteitKwh} kWh opslag${sp.fase ? ' · ' + sp.fase : ''}${sp.bouwvorm ? ' · ' + (sp.bouwvorm === 'plugin' ? 'Plug-in' : 'Geïntegreerd') : ''}`;
    if (p.category === 'omvormer')     return `${sp.vermogenKw ?? '?'} kW${sp.fase ? ' · ' + sp.fase : ''}${sp.hybride ? ' · hybride (batterij-gereed)' : ''}`;
    if (p.category === 'laadpaal')     return `${sp.vermogenKw ?? '?'} kW${sp.fase ? ' · ' + sp.fase : ''}${sp.slim ? ' · slim laden' : ''}`;
    return '';
  }

  // ---------------------------------------------------------------------------
  // STATE + RENDER
  // ---------------------------------------------------------------------------
  const state = { step:'category', category:null, qIndex:0, answers:{}, products:null, results:null, loading:false };

  function setProgress(pct){ document.getElementById('khProgressFill').style.width = pct + '%'; }

  async function selectCategory(catId) {
    state.category = catId;
    state.qIndex = 0;
    state.answers = {};
    state.step = 'questions';
    render();
  }

  function selectAnswer(qId, value) {
    state.answers[qId] = value;
    render();
  }

  async function goNext() {
    const qs = QUESTIONS[state.category];
    if (state.qIndex < qs.length - 1) {
      state.qIndex++;
      render();
    } else {
      await showResults();
    }
  }

  function goBack() {
    if (state.step === 'questions' && state.qIndex === 0) {
      state.step = 'category';
    } else if (state.step === 'questions') {
      state.qIndex--;
    } else if (state.step === 'result') {
      state.step = 'questions';
      state.qIndex = QUESTIONS[state.category].length - 1;
    }
    render();
  }

  async function showResults() {
    state.loading = true;
    state.error = null;
    render();
    try {
      if (!state.products) {
        state.products = await fetchLiveProducts();
      }
      state.results = getMatches(state.category, state.answers, state.products);
    } catch (err) {
      state.error = err.message || 'Kon actueel assortiment niet laden';
      state.results = [];
    }
    state.loading = false;
    state.step = 'result';
    render();
  }

  function restart() {
    state.step = 'category';
    state.category = null;
    state.qIndex = 0;
    state.answers = {};
    state.results = null;
    render();
  }

  function render() {
    const body = document.getElementById('khBody');

    if (state.step === 'category') {
      setProgress(0);
      body.innerHTML = `
        <div class="kh-eyebrow">Stap 1 van 3</div>
        <h2 class="kh-title">Waarvoor wil je advies?</h2>
        <p class="kh-sub">Kies een categorie. Op basis van een paar korte vragen laten we je meteen zien welke producten <em>nu</em> leverbaar zijn.</p>
        <div class="kh-cat-grid">
          ${CATEGORIES.map(c => `
            <button class="kh-cat-card" onclick="selectCategory('${c.id}')">
              <div class="kh-cat-icon">${c.icon}</div>
              <div class="kh-cat-name">${c.name}</div>
              <div class="kh-cat-desc">${c.desc}</div>
            </button>
          `).join('')}
        </div>
      `;
      return;
    }

    if (state.step === 'questions') {
      const qs = QUESTIONS[state.category];
      const q = qs[state.qIndex];
      const catName = CATEGORIES.find(c => c.id === state.category).name;
      const pct = Math.round(((state.qIndex) / qs.length) * 100);
      setProgress(10 + pct * 0.6);

      body.innerHTML = `
        <div class="kh-eyebrow">${catName} — vraag ${state.qIndex + 1} van ${qs.length}</div>
        <div class="kh-q-label">${q.label}</div>
        ${q.help ? `<div class="kh-q-help">${q.help}</div>` : '<div style="height:14px"></div>'}
        <div class="kh-opt-list">
          ${q.options.map(o => `
            <button class="kh-opt ${state.answers[q.id] === o.value ? 'is-selected' : ''}" onclick="selectAnswer('${q.id}','${o.value}')">
              <span class="kh-opt-text">
                <span>${o.label}</span>
                ${o.note ? `<span class="kh-opt-note">${o.note}</span>` : ''}
              </span>
              <span class="kh-opt-check"></span>
            </button>
          `).join('')}
        </div>
        <div class="kh-nav-row">
          <button class="kh-btn kh-btn-ghost" onclick="goBack()">← Terug</button>
          <button class="kh-btn kh-btn-primary" ${state.answers[q.id] ? '' : 'disabled'} onclick="goNext()">
            ${state.qIndex === qs.length - 1 ? 'Toon actuele producten' : 'Volgende'}
          </button>
        </div>
      `;
      return;
    }

    if (state.loading) {
      setProgress(85);
      body.innerHTML = `
        <div class="kh-eyebrow">Even geduld</div>
        <h2 class="kh-title">Actueel assortiment checken…</h2>
        <p class="kh-sub">We controleren welk actueel, zichtbaar assortiment past voordat we een advies tonen.</p>
      `;
      return;
    }

    if (state.step === 'result') {
      setProgress(100);
      const now = new Date().toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
      const catName = CATEGORIES.find(c => c.id === state.category).name;

      body.innerHTML = `
        <div class="kh-eyebrow">Jouw advies — ${catName}</div>
        <h2 class="kh-title" style="margin-bottom:14px;">Dit zijn nu passende producten</h2>
        <div class="kh-sync-line"><span class="kh-live-dot"></span> Live gecontroleerd om ${now} · alleen actueel zichtbare producten</div>

        ${state.error ? `
          <div class="kh-empty">
            ${state.error}. Probeer het later opnieuw, of neem contact op via de klantenservice.
          </div>
        ` : state.results.length === 0 ? `
          <div class="kh-empty">
            Geen exacte match op dit moment binnen het actuele assortiment.<br>
            Plan een adviesgesprek — we kijken direct met je mee naar alternatieven.
          </div>
        ` : state.results.map(p => `
          <div class="kh-product">
            <div class="kh-product-thumb">${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : '📦'}</div>
            <div class="kh-product-main">
              <div class="kh-product-top">
                <div>
                  <div class="kh-product-name">${p.name}</div>
                  <div class="kh-product-specs">${formatSpecs(p)}</div>
                </div>
                <div class="kh-product-price">€${p.price.toLocaleString('nl-NL')}</div>
              </div>
              <div style="display:flex;justify-content:flex-end;align-items:center;">
                <a class="kh-product-cta" href="${p.url}">Bekijk product →</a>
              </div>
            </div>
          </div>
        `).join('')}

        <div class="kh-advice-box">
          <div class="kh-advice-text"><strong>Twijfel je nog?</strong><br>Plan een vrijblijvend adviesgesprek en neem deze uitkomst samen door.</div>
          <a class="kh-btn kh-btn-orange" href="https://bookings.cloud.microsoft/book/AdviesgesprekSolarOutlet@gridparityconcepts.com/?ismsaljsauthenabled" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;">Plan gesprek</a>
        </div>

        <div class="kh-nav-row">
          <button class="kh-btn kh-btn-ghost" onclick="goBack()">← Vraag aanpassen</button>
          <button class="kh-btn kh-btn-ghost" onclick="restart()">Opnieuw beginnen</button>
        </div>
      `;
      return;
    }
  }

  render();
</script>

</body>
</html>
